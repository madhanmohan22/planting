<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPG Connect - Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="login-box glass-panel">
            <div class="login-header">
                <h1>LPG Connect</h1>
                <p>Supply Chain Management System</p>
            </div>
            
            <div id="error-alert" class="alert alert-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" required>
                </div>
                
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            
            errorAlert.style.display = 'none';

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const response = await fetch('/token', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('user_id', data.user_id);
                    
                    // Redirect based on role
                    if (data.role === 'ADMIN') window.location.href = '/static/admin_dashboard.html';
                    else if (data.role === 'SUPER_MASTER') window.location.href = '/static/sm_dashboard.html';
                    else if (data.role === 'DISTRIBUTOR') window.location.href = '/static/dist_dashboard.html';
                    else if (data.role === 'PLANT') window.location.href = '/static/plant_dashboard.html';
                } else {
                    const err = await response.json();
                    errorAlert.textContent = err.detail || 'Login failed';
                    errorAlert.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorAlert.textContent = 'Network error occurred';
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
